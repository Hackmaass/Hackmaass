name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: exactly 5 colors, first = zero contributions
          outputs: |
            dist/github-snake-dark.svg?color_snake=#FF5B2E&color_dots=#1b2140,#3446ff,#6672ff,#99a2ff,#e6e9ff
            dist/github-snake.svg?color_snake=#FF5B2E&color_dots=#e8ebff,#b9c2ff,#7f8cff,#4a5bff,#2b3bff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
