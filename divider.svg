<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 16" width="850" height="16">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd700" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffd700" stop-opacity="1" />
      <stop offset="1" stop-color="#ffd700" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line x1="0" y1="8" x2="850" y2="8" stroke="#21262d" stroke-width="1" />
  <!-- Gold pulse sweeping the rail -->
  <rect x="-160" y="7" width="160" height="2" fill="url(#pulse)">
    <animate attributeName="x" values="-160;850" dur="4s" repeatCount="indefinite" />
  </rect>
  <!-- Centre node -->
  <g transform="translate(425 8) rotate(45)">
    <rect x="-4" y="-4" width="8" height="8" fill="#0d1117" stroke="#ffd700" stroke-width="1.5" />
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffd700">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </rect>
  </g>
  <path d="M 0 2 L 0 14 M 850 2 L 850 14" stroke="#ffd700" stroke-width="2" />
</svg>
